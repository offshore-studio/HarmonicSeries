name: Web

on:
  push:
    branches: [web]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [web]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Static export build
        env:
          STATIC_EXPORT: "1"
          NEXT_BASE_PATH: /harmonic-series
          NEXT_PUBLIC_LAB_ENABLED: "false"
        run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
